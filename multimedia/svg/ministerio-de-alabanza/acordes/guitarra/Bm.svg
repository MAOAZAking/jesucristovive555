<svg width="150" height="180" xmlns="http://www.w3.org/2000/svg">
  <g>

    <!-- Cuerdas -->
    <line x1="20" y1="30" x2="20" y2="130" stroke="black"/>
    <line x1="35" y1="30" x2="35" y2="130" stroke="black"/>
    <line x1="50" y1="30" x2="50" y2="130" stroke="black"/>
    <line x1="65" y1="30" x2="65" y2="130" stroke="black"/>
    <line x1="80" y1="30" x2="80" y2="130" stroke="black"/>
    <line x1="95" y1="30" x2="95" y2="130" stroke="black"/>

    <!-- Cabeza de guitarra rellena, trapezoidal más ancha arriba -->
    <polygon points="10,10 105,10 95,30 20,30" fill="black" stroke="black" stroke-width="1"/>

    <!-- Trastes -->
    <line x1="20" y1="30" x2="95" y2="30" stroke="black"/>
    <line x1="20" y1="50" x2="95" y2="50" stroke="black"/>
    <line x1="20" y1="70" x2="95" y2="70" stroke="black"/>
    <line x1="20" y1="90" x2="95" y2="90" stroke="black"/>
    <line x1="20" y1="110" x2="95" y2="110" stroke="black"/>
    <line x1="20" y1="130" x2="95" y2="130" stroke="black"/>


    <!-- Cejilla -->
    <rect x="10" y="55" width="95" height="10" rx="5" ry="5" fill="black"/>

    <!-- Indicador traste -->
    <text x="120" y="65" font-size="20" fill="black" stroke="black" stroke-width="2">2</text>


    <!-- Puntos de los dedos -->
    <circle cx="80" cy="80" r="6" fill="black"/>
    <circle cx="50" cy="100" r="6" fill="black"/>
    <circle cx="65" cy="100" r="6" fill="black"/>

  </g>

</svg>