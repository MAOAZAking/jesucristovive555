<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Ministerio de Restauración Jesucris✟o ¡VIVE!</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="multimedia/img/logo-1-ministerio-de-restauracion-jesucristo-¡vive!.png" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-------------------- GOOGLE FONTS --------------------->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Tipo letra para "Ministerio de Restauración" -->
        <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "Jesucris o" -->
        <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "t" en forma de cruz -->
        <link href="https://fonts.googleapis.com/css2?family=Saira:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "¡VIVE!" -->
        <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="css/index.css">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/contactenos.css">
        
        <style>
            /* Estilos específicos para la validación facial */
            #contenedor-validacion {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgb(5, 5, 111);
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
            }

            #video-input {
                width: 100%;
                max-width: 600px;
                border-radius: 15px;
                border: 4px solid red;
                margin-bottom: 20px;
                /* Espejo para que se sienta natural */
                transform: scaleX(-1); 
            }

            .mensaje-estado {
                font-family: 'Playball', cursive;
                font-size: 2rem;
                text-align: center;
                margin-top: 20px;
            }

            .spinner-facial {
                width: 50px;
                height: 50px;
                border: 5px solid rgba(255,255,255,0.3);
                border-radius: 50%;
                border-top-color: red;
                animation: spin 1s ease-in-out infinite;
                margin-bottom: 20px;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>

        <!-- Contenedor de Validación Facial -->
        <div id="contenedor-validacion">
            <div class="spinner-facial"></div>
            <h2 class="mensaje-estado" id="mensaje-estado">Cargando modelos de reconocimiento...</h2>
            <!-- El video se mostrará aquí -->
            <video id="video-input" autoplay muted playsinline></video>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Cargar Face-API.js -->
        <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
        <!-- Cargar Base de Datos Simulada de Rostros -->
        <script src="js/datos_faciales.js"></script>

        <script src="js/index.js"></script>
        <script src="js/global.js"></script>

        <script>
            // Lógica de Reconocimiento Facial
            document.addEventListener('DOMContentLoaded', async () => {
                const video = document.getElementById('video-input');
                const mensaje = document.getElementById('mensaje-estado');
                let intentos = 0;
                const MAX_INTENTOS = 2;
                let usuarios = [];

                // 1. Cargar Modelos y Usuarios
                try {
                    mensaje.innerText = "Cargando modelos y usuarios...";
                    
                    // Cargar JSON de usuarios
                    const response = await fetch('json/usuarios.json');
                    usuarios = await response.json();

                    // Cargar modelos de face-api (Asumiendo que la carpeta está en la raíz)
                    await faceapi.nets.ssdMobilenetv1.loadFromUri('/modelos_rf');
                    await faceapi.nets.faceLandmark68Net.loadFromUri('/modelos_rf');
                    await faceapi.nets.faceRecognitionNet.loadFromUri('/modelos_rf');

                    mensaje.innerText = "Solicitando acceso a la cámara...";
                    startVideo();
                } catch (error) {
                    console.error(error);
                    mensaje.innerText = "Error cargando recursos. Verifica la consola.";
                }

                function startVideo() {
                    navigator.mediaDevices.getUserMedia({ video: {} })
                        .then(stream => {
                            video.srcObject = stream;
                        })
                        .catch(err => {
                            console.error(err);
                            mensaje.innerText = "Por favor, permite el acceso a la cámara.";
                        });
                }

                video.addEventListener('play', () => {
                    mensaje.innerText = "Validando identidad...";
                    
                    // Crear LabeledFaceDescriptors para el matcher
                    const labeledDescriptors = usuarios.map(usuario => {
                        const key = usuario.datosfaciales;
                        // Buscar en el archivo js/datos_faciales.js
                        const descriptorArray = BASE_DATOS_ROSTROS[key];
                        
                        if (descriptorArray) {
                            return new faceapi.LabeledFaceDescriptors(
                                usuario.nombredeusuario,
                                [new Float32Array(descriptorArray)]
                            );
                        }
                    }).filter(d => d !== undefined);

                    if (labeledDescriptors.length === 0) {
                        mensaje.innerText = "No hay datos faciales configurados.";
                        return;
                    }

                    const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);

                    const interval = setInterval(async () => {
                        if (intentos >= MAX_INTENTOS) {
                            clearInterval(interval);
                            mensaje.innerText = "Rostro no reconocido. Volviendo...";
                            setTimeout(() => {
                                window.history.back(); // Volver a la página anterior
                            }, 2000);
                            return;
                        }

                        const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                        
                        if (detections.length > 0) {
                            // Tomamos el primer rostro detectado
                            const bestMatch = faceMatcher.findBestMatch(detections[0].descriptor);
                            
                            if (bestMatch.label !== 'unknown') {
                                clearInterval(interval);
                                const usuarioEncontrado = usuarios.find(u => u.nombredeusuario === bestMatch.label);
                                
                                mensaje.innerText = `¡Bienvenido ${usuarioEncontrado.nombrecompleto || usuarioEncontrado.nombredeusuario}!`;
                                mensaje.style.color = "#00ff00";

                                // Guardar sesión temporalmente
                                sessionStorage.setItem('usuario_actual', JSON.stringify(usuarioEncontrado));

                                setTimeout(() => {
                                    window.location.href = usuarioEncontrado.urlderedireccion;
                                }, 1500);
                            } else {
                                intentos++;
                                mensaje.innerText = `Verificando... Intento ${intentos}/${MAX_INTENTOS}`;
                            }
                        }
                    }, 2000); // Validar cada 2 segundos
                });
            });
        </script>
    </body>
</html>
