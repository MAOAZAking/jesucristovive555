<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Ministerio de Restauración Jesucris✟o ¡VIVE!</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="multimedia/img/logo-1-ministerio-de-restauracion-jesucristo-¡vive!.png" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-------------------- GOOGLE FONTS --------------------->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Tipo letra para "Ministerio de Restauración" -->
        <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "Jesucris o" -->
        <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "t" en forma de cruz -->
        <link href="https://fonts.googleapis.com/css2?family=Saira:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "¡VIVE!" -->
        <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/crear-usuario.css">
    </head>
<body>
    <div class="bg-real visible"></div>

    <div id="mensaje-exito" class="mensaje-flotante">
        Estamos configurando y guardando los datos de tu perfil, por favor espera...
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-registro p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <h2 class="titulo-bienvenida">¡Bienvenido!</h2>
                        <h3 id="saludo-usuario" class="mb-3"></h3>
                        <p>Tu nombre de usuario actual es: <strong id="usuario-actual-display" class="text-warning"></strong></p>
                        <p class="small">Puedes cambiarlo si deseas y establecer tu contrasena.</p>
                    </div>

                    <form id="form-registro">
                        <div class="mb-3">
                            <label for="nuevo-usuario" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="nuevo-usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="nueva-password" class="form-label">contrasena</label>
                            <input type="password" class="form-control" id="nueva-password" required>
                        </div>

                        <!-- Área de Video para Validación -->
                        <div class="text-center mb-3">
                            <video id="video-validacion" autoplay muted playsinline></video>
                            <p id="estado-camara" class="text-warning mt-2"></p>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" id="btn-validar" class="btn btn-secondary" disabled>
                                Validar Datos <i class="bi bi-person-bounding-box"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="js/datos_faciales.js"></script>
    <script src="js/config_github.js"></script> <!-- Cargar Configuración Centralizada -->
    <script src="js/crear-usuario.js"></script>
</body>
</html>
