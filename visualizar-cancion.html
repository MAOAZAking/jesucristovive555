<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Ministerio de Restauración Jesucris✟o ¡VIVE!</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="multimedia/img/logo-1-ministerio-de-restauracion-jesucristo-¡vive!.png" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-------------------- GOOGLE FONTS --------------------->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Tipo letra para "Ministerio de Restauración" -->
        <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "Jesucris o" -->
        <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "t" en forma de cruz -->
        <link href="https://fonts.googleapis.com/css2?family=Saira:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "¡VIVE!" -->
        <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/visualizar-cancion.css">
        <!-- Fuente adicional para acordes -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    </head>
<body>
    <div class="bg-real visible"></div>

    <!-- Botones Flotantes Instrumentos -->
    <div class="botones-flotantes-derecha">
        <button class="btn-instrumento activo" id="btn-guitarra" onclick="cambiarInstrumento('guitarra')" title="Guitarra">
            🎸
        </button>
        <button class="btn-instrumento" id="btn-piano" onclick="cambiarInstrumento('piano')" title="Piano">
            🎹
        </button>
    </div>

    <div class="barra-superior">MINISTERIO DE RESTAURACIÓN JESUCRISTO ¡VIVE!</div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="contribucion-ministerio-alabanza.html"><i class="bi bi-arrow-left-circle"></i> Volver al Listado</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="contenedor-cancion">
                    <h1 id="titulo" class="titulo-cancion">Cargando...</h1>
                    <div id="tipo" class="tipo-cancion"></div>
                    <hr>
                    <div id="contenido" class="contenido-cancion"></div>
                    
                    <!-- Sección de Metadatos -->
                    <div class="mt-5 pt-3 border-top text-center text-muted small fst-italic">
                        <p id="info-implementacion" class="mb-1"></p>
                        <p id="info-edicion" class="mb-0"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Acordes (Igual que en el editor) -->
    <div class="modal fade" id="modalAcorde" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="titulo-acorde-modal">Acorde</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" id="imagen-acorde-modal" alt="Diagrama" style="max-width:100%;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/visualizar-cancion.js"></script>
</body>
</html>
