name: Actualizar Devocional Diario

on:
  schedule:
    # Se ejecuta a las 05:10 Hora Colombia (UTC-5)
    # 00:01 Colombia = 010:10 UTC
    - cron: '10 10 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  update-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Instalar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Ejecutar script de actualización
      env:
        API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      run: node actualizar_devocional.js
    
    - name: Inyectar API Key de YouVersion
      env:
        YOUVERSION_KEY: ${{ secrets.YOUVERSION_API_KEY }}
      run: sed -i "s/TU_API_KEY_AQUI/$YOUVERSION_KEY/g" js/citas.js

    - name: Guardar cambios (Commit & Push)
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "📹 Actualización automática: Devocional del día"
        branch: main