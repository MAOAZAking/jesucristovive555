<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Ministerio de Restauración Jesucris✟o ¡VIVE!</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="multimedia/img/logo-1-ministerio-de-restauracion-jesucristo-¡vive!.png" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-------------------- GOOGLE FONTS --------------------->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Tipo letra para "Ministerio de Restauración" -->
        <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "Jesucris o" -->
        <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "t" en forma de cruz -->
        <link href="https://fonts.googleapis.com/css2?family=Saira:wght@700&display=swap" rel="stylesheet">
        <!-- Tipo letra para "¡VIVE!" -->
        <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/contribucion-ministerio-alabanza.css">
        <!-- Fuente adicional para editor -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    </head>
<body>
    <div class="bg-real visible"></div>
    
    <!-- Botones Flotantes Instrumentos -->
    <div class="botones-flotantes-derecha">
        <button class="btn-instrumento activo" id="btn-guitarra" onclick="cambiarInstrumento('guitarra')" title="Guitarra">
            🎸
        </button>
        <button class="btn-instrumento" id="btn-piano" onclick="cambiarInstrumento('piano')" title="Piano">
            🎹
        </button>
    </div>

    <div class="barra-superior">MINISTERIO DE RESTAURACIÓN JESUCRISTO ¡VIVE!</div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="who-logs-in.html"><i class="bi bi-arrow-left-circle"></i> Volver al Inicio</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="contenedor-gestion">
                    <h1 class="titulo-gestion">Gestión de Alabanza y Adoración</h1>

                    <!-- Menú Principal -->
                    <div id="menu-principal" class="row">
                        <div class="col-md-6">
                            <button class="btn btn-opcion-grande btn-agregar" onclick="mostrarAgregar()">
                                <i class="bi bi-plus-circle-dotted"></i> AGREGAR CANCIÓN
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-opcion-grande btn-editar" onclick="mostrarBuscar()">
                                <i class="bi bi-pencil-square"></i> EDITAR UNA CANCIÓN
                            </button>
                        </div>
                    </div>

                    <!-- Sección Buscador -->
                    <div id="seccion-buscador" class="buscador-container">
                        <div class="d-flex gap-2 mb-3">
                            <input type="text" id="input-busqueda" class="form-control" placeholder="Buscar por título o letra...">
                            <select id="filtro-tipo-busqueda" class="form-select w-auto">
                                <option value="todos">Todos</option>
                                <option value="Alabanza">Alabanza</option>
                                <option value="Adoracion">Adoración</option>
                            </select>
                            <button class="btn btn-secondary" onclick="volverAlMenu()">Cancelar</button>
                        </div>
                        <div class="list-group" id="lista-resultados"></div>
                    </div>

                    <!-- Editor de Canción -->
                    <div id="editor-cancion" class="editor-container">
                        <h3 id="titulo-editor" class="mb-3" style="font-family: 'Charm', cursive; color: rgb(5, 5, 111);">Nueva Canción</h3>
                        
                        <form id="form-cancion">
                            <input type="hidden" id="id-cancion-actual">
                            <!-- Campos ocultos para metadatos -->
                            <input type="hidden" id="meta-creado-por">
                            <input type="hidden" id="meta-fecha-creacion">
                            
                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label class="form-label">Nombre de la Canción</label>
                                    <input type="text" id="nombre-cancion" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Tipo</label>
                                    <select id="tipo-cancion" class="form-select">
                                        <option value="Alabanza">Alabanza</option>
                                        <option value="Adoracion">Adoración</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Letra y Acordes (Cifrado Americano)</label>
                                <p class="text-muted small">
                                    Escribe intercalado: una línea de acordes y abajo la letra. Usa espacios para ubicar el acorde.
                                </p>
                                <textarea id="contenido-cancion" class="form-control area-texto-cancion" placeholder="Escribe aquí..."></textarea>
                            </div>

                            <h4 class="mt-4">Vista Previa (Escala Real)</h4>
                            <div id="vista-previa-cancion"></div>

                            <div class="d-grid gap-2 mt-4 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary me-md-2" onclick="volverAlMenu()">Cancelar</button>
                                <button type="button" class="btn btn-success" id="btn-guardar" onclick="guardarCancion()">
                                    <i class="bi bi-cloud-upload"></i> Guardar Canción
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal Acordes -->
    <div class="modal fade" id="modalAcorde" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="titulo-acorde-modal">Acorde</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" id="imagen-acorde-modal" alt="Diagrama">
                    <p class="mt-2 text-muted">Así se hace este acorde.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/config_github.js"></script> <!-- Configuración Centralizada -->
    <script src="js/contribucion-ministerio-alabanza.js"></script>
</body>
</html>
