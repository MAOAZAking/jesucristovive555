<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Alabanzas - Ministerio Jesucristo ¡VIVE!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Kalam:wght@700&family=Playball&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    
    <style>
        body { color: white; }
        
        .contenedor-gestion {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-top: 100px;
            margin-bottom: 50px;
            color: black;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .titulo-gestion {
            font-family: 'Kalam', cursive;
            color: rgb(179, 74, 9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .btn-opcion-grande {
            padding: 20px;
            font-size: 1.5rem;
            font-family: 'Playball', cursive;
            border-radius: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            margin-bottom: 20px;
            border: 3px solid transparent;
        }

        .btn-agregar { background-color: rgb(5, 5, 111); color: white; }
        .btn-editar { background-color: rgb(179, 74, 9); color: white; }

        .btn-opcion-grande:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: white;
            border-color: #ffcc00;
        }

        .editor-container { display: none; animation: fadeIn 0.5s; }

        .area-texto-cancion {
            font-family: 'Roboto Mono', monospace;
            white-space: pre;
            min-height: 300px;
            font-size: 14px;
            background-color: #f8f9fa;
            border: 2px solid #ccc;
        }

        #vista-previa-cancion {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Roboto Mono', monospace;
            white-space: pre-wrap;
            margin-top: 20px;
            min-height: 200px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .linea-acordes { color: rgb(0, 0, 139); font-weight: bold; height: 1.5em; }
        .acorde-link { color: rgb(0, 0, 139); text-decoration: none; cursor: pointer; border-bottom: 1px dotted blue; }
        .acorde-link:hover { color: red; background-color: rgba(0,0,255,0.1); }
        .linea-letra { color: black; margin-bottom: 10px; }

        .buscador-container { display: none; margin-bottom: 20px; }
        .item-cancion { cursor: pointer; transition: background 0.2s; }
        .item-cancion:hover { background-color: #f0f0f0; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #imagen-acorde-modal { max-width: 100%; height: auto; }

        /* Botones flotantes para instrumentos */
        .botones-flotantes-derecha {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        .btn-instrumento {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: rgba(5, 5, 111, 0.9);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-instrumento:hover {
            transform: scale(1.1);
            background-color: rgb(179, 74, 9);
        }
        .btn-instrumento.activo {
            background-color: rgb(179, 74, 9);
            box-shadow: 0 0 15px #ffcc00;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="bg-real visible"></div>
    
    <!-- Botones Flotantes Instrumentos -->
    <div class="botones-flotantes-derecha">
        <button class="btn-instrumento activo" id="btn-guitarra" onclick="cambiarInstrumento('guitarra')" title="Guitarra">
            🎸
        </button>
        <button class="btn-instrumento" id="btn-piano" onclick="cambiarInstrumento('piano')" title="Piano">
            🎹
        </button>
    </div>

    <div class="barra-superior">MINISTERIO DE RESTAURACIÓN JESUCRISTO ¡VIVE!</div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="who-logs-in.html"><i class="bi bi-arrow-left-circle"></i> Volver al Inicio</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="contenedor-gestion">
                    <h1 class="titulo-gestion">Gestión de Alabanza y Adoración</h1>

                    <!-- Menú Principal -->
                    <div id="menu-principal" class="row">
                        <div class="col-md-6">
                            <button class="btn btn-opcion-grande btn-agregar" onclick="mostrarAgregar()">
                                <i class="bi bi-plus-circle-dotted"></i> AGREGAR CANCIÓN
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-opcion-grande btn-editar" onclick="mostrarBuscar()">
                                <i class="bi bi-pencil-square"></i> EDITAR UNA CANCIÓN
                            </button>
                        </div>
                    </div>

                    <!-- Sección Buscador -->
                    <div id="seccion-buscador" class="buscador-container">
                        <div class="d-flex gap-2 mb-3">
                            <input type="text" id="input-busqueda" class="form-control" placeholder="Buscar por título o letra...">
                            <select id="filtro-tipo-busqueda" class="form-select w-auto">
                                <option value="todos">Todos</option>
                                <option value="Alabanza">Alabanza</option>
                                <option value="Adoracion">Adoración</option>
                            </select>
                            <button class="btn btn-secondary" onclick="volverAlMenu()">Cancelar</button>
                        </div>
                        <div class="list-group" id="lista-resultados"></div>
                    </div>

                    <!-- Editor de Canción -->
                    <div id="editor-cancion" class="editor-container">
                        <h3 id="titulo-editor" class="mb-3" style="font-family: 'Charm', cursive; color: rgb(5, 5, 111);">Nueva Canción</h3>
                        
                        <form id="form-cancion">
                            <input type="hidden" id="id-cancion-actual">
                            <!-- Campos ocultos para metadatos -->
                            <input type="hidden" id="meta-creado-por">
                            <input type="hidden" id="meta-fecha-creacion">
                            
                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label class="form-label">Nombre de la Canción</label>
                                    <input type="text" id="nombre-cancion" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Tipo</label>
                                    <select id="tipo-cancion" class="form-select">
                                        <option value="Alabanza">Alabanza</option>
                                        <option value="Adoracion">Adoración</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Letra y Acordes (Cifrado Americano)</label>
                                <p class="text-muted small">
                                    Escribe intercalado: una línea de acordes y abajo la letra. Usa espacios para ubicar el acorde.
                                </p>
                                <textarea id="contenido-cancion" class="form-control area-texto-cancion" placeholder="Escribe aquí..."></textarea>
                            </div>

                            <h4 class="mt-4">Vista Previa (Escala Real)</h4>
                            <div id="vista-previa-cancion"></div>

                            <div class="d-grid gap-2 mt-4 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary me-md-2" onclick="volverAlMenu()">Cancelar</button>
                                <button type="button" class="btn btn-success" id="btn-guardar" onclick="guardarCancion()">
                                    <i class="bi bi-cloud-upload"></i> Guardar Canción
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal Acordes -->
    <div class="modal fade" id="modalAcorde" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="titulo-acorde-modal">Acorde</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" id="imagen-acorde-modal" alt="Diagrama">
                    <p class="mt-2 text-muted">Así se hace este acorde.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config_github.js"></script> <!-- Configuración Centralizada -->
    <script>
        let listaCanciones = [];
        let usuarioActual = "Desconocido";

        document.addEventListener('DOMContentLoaded', async () => {
            // Obtener usuario de la sesión
            const sesion = JSON.parse(sessionStorage.getItem('usuario_actual'));
            if (sesion && sesion.nombredeusuario) {
                usuarioActual = sesion.nombredeusuario;
            }

            // Cargar datos locales y luego remotos
            const localData = localStorage.getItem('canciones_local');
            if (localData) {
                listaCanciones = JSON.parse(localData);
            }
            cargarCancionesDesdeGitHub();
            
            document.getElementById('contenido-cancion').addEventListener('input', function() {
                actualizarVistaPrevia(this.value);
            });
            document.getElementById('input-busqueda').addEventListener('input', filtrarCanciones);
            document.getElementById('filtro-tipo-busqueda').addEventListener('change', filtrarCanciones);
        });

        function mostrarAgregar() {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('editor-cancion').style.display = 'block';
            document.getElementById('titulo-editor').innerText = 'Agregar Nueva Canción';
            
            document.getElementById('id-cancion-actual').value = '';
            document.getElementById('nombre-cancion').value = '';
            document.getElementById('contenido-cancion').value = '';
            document.getElementById('vista-previa-cancion').innerHTML = '';
            
            // Limpiar metadatos ocultos
            document.getElementById('meta-creado-por').value = '';
            document.getElementById('meta-fecha-creacion').value = '';
        }

        function mostrarBuscar() {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('seccion-buscador').style.display = 'block';
            filtrarCanciones();
        }

        function volverAlMenu() {
            document.getElementById('menu-principal').style.display = 'flex';
            document.getElementById('editor-cancion').style.display = 'none';
            document.getElementById('seccion-buscador').style.display = 'none';
        }

        function actualizarVistaPrevia(texto) {
            const html = procesarTextoCancion(texto);
            document.getElementById('vista-previa-cancion').innerHTML = html;
        }

        function procesarTextoCancion(texto) {
            if (!texto) return '';
            const lineas = texto.split('\n');
            let html = '';
            lineas.forEach(linea => {
                if (esLineaDeAcordes(linea)) {
                    const lineaProcesada = linea.replace(/([A-G][#b]?(?:m|maj|min|dim|aug|sus|add|7|9|11|13|5|6)?(?:\/[A-G][#b]?)?)/g, 
                        '<a class="acorde-link" onclick="verAcorde(\'$1\')">$1</a>');
                    html += `<div class="linea-acordes">${lineaProcesada}</div>`;
                } else {
                    html += `<div class="linea-letra">${linea}</div>`;
                }
            });
            return html;
        }

        function esLineaDeAcordes(linea) {
            const lineaTrim = linea.trim();
            if (lineaTrim.length === 0) return false;
            const palabras = lineaTrim.split(/\s+/);
            const regexAcorde = /^[A-G][#b]?(?:m|maj|min|dim|aug|sus|add|7|9|11|13|5|6)?(?:\/[A-G][#b]?)?$/;
            const conteoAcordes = palabras.filter(p => regexAcorde.test(p)).length;
            return (conteoAcordes / palabras.length) > 0.8;
        }

        let instrumentoActual = 'guitarra'; // Instrumento por defecto

        function cambiarInstrumento(instrumento) {
            instrumentoActual = instrumento;
            // Actualizar estilo de botones
            document.querySelectorAll('.btn-instrumento').forEach(btn => btn.classList.remove('activo'));
            document.getElementById(`btn-${instrumento}`).classList.add('activo');
        }

        function verAcorde(nombreAcorde) {
            const nombreArchivo = nombreAcorde.replace('#', 's').replace('/', '_'); 
            document.getElementById('titulo-acorde-modal').innerText = `Acorde (${instrumentoActual}): ${nombreAcorde}`;
            // Ruta actualizada
            document.getElementById('imagen-acorde-modal').src = `multimedia/img/ministerio-de-alabanza/acordes/${instrumentoActual}/${nombreArchivo}.png`; 
            document.getElementById('imagen-acorde-modal').onerror = function() {
                this.src = 'multimedia/img/logo-1-ministerio-de-restauracion-jesucristo-¡vive!.png';
            };
            new bootstrap.Modal(document.getElementById('modalAcorde')).show();
        }

        async function cargarCancionesDesdeGitHub() {
            try {
                const url = `https://api.github.com/repos/${CONFIG_GITHUB.OWNER}/${CONFIG_GITHUB.REPO}/contents/${CONFIG_GITHUB.PATH_CANCIONES}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.content) {
                    const contenidoDecodificado = decodeURIComponent(escape(window.atob(data.content)));
                    listaCanciones = JSON.parse(contenidoDecodificado);
                    localStorage.setItem('canciones_local', JSON.stringify(listaCanciones));
                }
            } catch (error) {
                console.error("Error cargando canciones:", error);
            }
        }

        function filtrarCanciones() {
            const texto = document.getElementById('input-busqueda').value.toLowerCase();
            const tipo = document.getElementById('filtro-tipo-busqueda').value;
            const contenedor = document.getElementById('lista-resultados');
            contenedor.innerHTML = '';

            const filtradas = listaCanciones.filter(c => {
                const coincideTexto = c.titulo.toLowerCase().includes(texto) || c.contenido.toLowerCase().includes(texto);
                const coincideTipo = tipo === 'todos' || c.tipo === tipo;
                return coincideTexto && coincideTipo;
            });

            if (filtradas.length === 0) {
                contenedor.innerHTML = '<div class="list-group-item text-center text-muted">No se encontraron canciones.</div>';
                return;
            }

            filtradas.forEach(c => {
                const item = document.createElement('a');
                item.className = 'list-group-item list-group-item-action item-cancion';
                item.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${c.titulo}</h5>
                        <div>
                            <small class="badge ${c.tipo === 'Alabanza' ? 'bg-primary' : 'bg-warning text-dark'} me-2">${c.tipo}</small>
                            <a href="visualizar-cancion.html?id=${c.id}" class="btn btn-sm btn-info text-white" onclick="event.stopPropagation();"><i class="bi bi-eye-fill"></i> Ver</a>
                        </div>
                    </div>
                    <p class="mb-1 small text-muted text-truncate">${c.contenido.split('\n')[0]}...</p>
                `;
                item.onclick = () => cargarCancionParaEditar(c.id);
                contenedor.appendChild(item);
            });
        }

        function cargarCancionParaEditar(id) {
            const cancion = listaCanciones.find(c => c.id === id);
            if (!cancion) return;

            document.getElementById('seccion-buscador').style.display = 'none';
            document.getElementById('editor-cancion').style.display = 'block';
            document.getElementById('titulo-editor').innerText = 'Editar Canción';

            document.getElementById('id-cancion-actual').value = cancion.id;
            document.getElementById('nombre-cancion').value = cancion.titulo;
            document.getElementById('tipo-cancion').value = cancion.tipo;
            document.getElementById('contenido-cancion').value = cancion.contenido;
            
            // Cargar metadatos existentes
            document.getElementById('meta-creado-por').value = cancion.creadoPor || '';
            document.getElementById('meta-fecha-creacion').value = cancion.fechaCreacion || '';

            actualizarVistaPrevia(cancion.contenido);
        }

        async function guardarCancion() {
            const btn = document.getElementById('btn-guardar');
            const idActual = document.getElementById('id-cancion-actual').value;
            const titulo = document.getElementById('nombre-cancion').value.trim();
            const tipo = document.getElementById('tipo-cancion').value;
            const contenido = document.getElementById('contenido-cancion').value;
            const fechaHoy = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

            if (!titulo || !contenido) {
                alert("Por favor completa el título y el contenido.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';

            try {
                let cancionGuardar = {};

                if (idActual) {
                    // EDICIÓN
                    const index = listaCanciones.findIndex(c => c.id == idActual);
                    if (index !== -1) {
                        cancionGuardar = {
                            ...listaCanciones[index], // Mantener datos viejos
                            titulo,
                            tipo,
                            contenido,
                            editadoPor: usuarioActual,
                            fechaEdicion: fechaHoy
                        };
                        listaCanciones[index] = cancionGuardar;
                    }
                } else {
                    // CREACIÓN
                    const nuevoId = Date.now().toString();
                    cancionGuardar = {
                        id: nuevoId,
                        titulo,
                        tipo,
                        contenido,
                        creadoPor: usuarioActual,
                        fechaCreacion: fechaHoy,
                        editadoPor: "",
                        fechaEdicion: ""
                    };
                    listaCanciones.push(cancionGuardar);
                }

                localStorage.setItem('canciones_local', JSON.stringify(listaCanciones));

                // Subir a GitHub
                const url = `https://api.github.com/repos/${CONFIG_GITHUB.OWNER}/${CONFIG_GITHUB.REPO}/contents/${CONFIG_GITHUB.PATH_CANCIONES}`;
                const getResponse = await fetch(url, { headers: { 'Authorization': `Bearer ${CONFIG_GITHUB.TOKEN}` } });
                const getData = await getResponse.json();
                const sha = getData.sha;

                const nuevoContenidoStr = JSON.stringify(listaCanciones, null, 4);
                const nuevoContenidoB64 = window.btoa(unescape(encodeURIComponent(nuevoContenidoStr)));

                const putResponse = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${CONFIG_GITHUB.TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Actualización de canciones: ${titulo} por ${usuarioActual}`,
                        content: nuevoContenidoB64,
                        sha: sha
                    })
                });

                if (putResponse.ok) {
                    alert("¡Canción guardada exitosamente!");
                    volverAlMenu();
                } else {
                    throw new Error("Error en la respuesta de GitHub");
                }
            } catch (error) {
                console.error(error);
                alert("Error al guardar en GitHub. Verifica tu conexión y el token.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-upload"></i> Guardar Canción';
            }
        }
    </script>
</body>
</html>
